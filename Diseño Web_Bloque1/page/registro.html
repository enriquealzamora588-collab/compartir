<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Explora. Lee. Sumérgete.">
    <meta name="author" content="Nautilus">
    <meta name="keywords" content="mangas, animes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Manga World</title>
    <link rel="icon" href="../logo.ico" type="image/x-icon">
</head>
<body bgcolor="#301915">

    <!-- HEADER -->
    <header>
        <table width="100%" bgcolor="#A85E5E" cellpadding="12">
            <tr>
                <td width="30%" align="center">
                    <a href="../index.html">
                        <img src="../dist/imagenes/Manga-PNG-Clipart.png" width="130" alt="logotipo">
                    </a>
                </td>
                <td width="70%" align="center">
                    <a href="registro.html"><button>Registro</button></a>
                    &nbsp;&nbsp;
                    <a href="bliblioteca.html"><button>Biblioteca</button></a>
                </td>
            </tr>
        </table>
    </header>

    <!-- MAIN -->
    <main>
        <br><br>
        <h1 align="center">
            <font color="white">Regístrate</font>
        </h1>
        <br>

        <table width="100%" cellpadding="15">
            <tr>
                <td width="15%"></td>

                <!-- FORMULARIO -->
                <td width="50%" bgcolor="#592C8A" valign="top">
                    <form>
                        <table width="100%" cellspacing="15" cellpadding="10">

                            <!-- Nombres y Apellidos -->
                            <tr>
                                <td>
                                    <font color="white"><b>Nombres:</b></font><br>
                                    <input type="text" name="nombres" required size="30" placeholder="Ingrese sus nombres">
                                </td>
                                <td>
                                    <font color="white"><b>Apellidos:</b></font><br>
                                    <input type="text" name="apellidos" required size="30" placeholder="Ingrese sus apellidos">
                                </td>
                            </tr>

                            <!-- Fecha y Correo -->
                            <tr>
                                <td>
                                    <font color="white"><b>Fecha de Nacimiento:</b></font><br>
                                    <input type="date" name="fecha" required>
                                </td>
                                <td>
                                    <font color="white"><b>Correo:</b></font><br>
                                    <input type="email" name="correo" required size="30" placeholder="ejemplo@gmail.com">
                                </td>
                            </tr>

                            <!-- Contraseñas -->
                            <tr>
                                <td>
                                    <font color="white"><b>Contraseña:</b></font><br>
                                    <input type="password" name="password" required size="30" placeholder="Crea una contraseña">
                                </td>
                                <td>
                                    <font color="white"><b>Confirmar Contraseña:</b></font><br>
                                    <input type="password" name="password2" required size="30" placeholder="Repite la contraseña">
                                </td>
                            </tr>

                            <!-- Género -->
                            <tr>
                                <td colspan="2">
                                    <font color="white"><b>Género:</b></font><br>
                                    <input type="radio" name="genero" value="masculino"> Masculino
                                    &nbsp;&nbsp;
                                    <input type="radio" name="genero" value="femenino"> Femenino
                                    &nbsp;&nbsp;
                                    <input type="radio" name="genero" value="otro"> Otro
                                </td>
                            </tr>

                            <!-- Términos -->
                            <tr>
                                <td colspan="2">
                                    <input type="checkbox" name="terminos" required>
                                    <font color="white">Acepto los términos y condiciones</font>
                                </td>
                            </tr>

                            <!-- Botones -->
                            <tr>
                                <td colspan="2" align="center">
                                    <br>
                                    <button type="submit">Registrar</button>
                                    &nbsp;&nbsp;
                                    <button type="reset">Limpiar</button>
                                </td>
                            </tr>

                        </table>
                    </form>
                </td>

                <!-- GIF -->
                <td width="35%" align="left" valign="gif">
                    <img src="https://media.tenor.com/n8Jf1VOI89AAAAAM/saitama-one-punch-man.gif" alt="Saitama" width="350">
                </td>
            </tr>
        </table>
        <br><br>
    </main>

    <!-- FOOTER -->
    <footer>
        <table width="100%" bgcolor="#211212" cellpadding="20">
            <tr>
                <td width="40%" align="center">
                    <a href="../index.html">
                        <img src="../dist/imagenes/Manga-PNG-Clipart.png" width="150" alt="logo">
                    </a>
                    <br><br>
                    <font color="white" size="3">Correo: mangaworld@gmail.com</font>
                </td>
                <td width="20%"></td>
                <td width="40%" align="center">
                    <font color="white" size="4"><b>Redes sociales</b></font>
                    <br><br>
                    <a href="https://www.facebook.com/" target="_blank">
                        <img src="https://thumbs.dreamstime.com/b/logotipo-de-facebook-con-archivo-pasos-vectoriales-color-cuadrado-coloreado-f%C3%A1cil-editar-y-fondo-blanco-alta-resoluci%C3%B3n-255557233.jpg" width="40" alt="Facebook">
                    </a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="https://www.instagram.com/" target="_blank">
                        <img src="https://img.magnific.com/vector-gratis/logotipo-instagram_1199-122.jpg" width="40" alt="Instagram">
                    </a>
                    
                </td>
            </tr>
        </table>   
    </footer>

</body>
</html>
